# Live deploy: every push to main builds the Eleventy site and publishes it to the
# Firebase Hosting live channel for the `paton-website` project (see .firebaserc).
#
# Required repository secret:
#   FIREBASE_SERVICE_ACCOUNT_PATON_WEBSITE — the JSON key of a service account with the
#   "Firebase Hosting Admin" and "Cloud Run Viewer" roles on the paton-website project,
#   pasted whole into the secret. No credential is stored in this repository.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hosting-live
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the site
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PATON_WEBSITE }}
          projectId: paton-website
          channelId: live
